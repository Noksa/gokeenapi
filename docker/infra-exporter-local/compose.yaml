services:
  exporter:
    image: gokeenapi-exporter-local:dev
    build:
      context: ${GOKEENAPI_ROOT:-../..}
      dockerfile: Dockerfile
      args:
        GOKEENAPI_VERSION: exporter-local
    user: "${EXPORTER_UID:-1000}:${EXPORTER_GID:-1000}"
    command: [exporter, --config, "/etc/gokeenapi/${EXPORTER_CONFIG_NAME:-exporter_example.yaml}", --listen, "0.0.0.0:9479"]
    environment:
      - GOKEENAPI_KEENETIC_LOGIN
      - GOKEENAPI_KEENETIC_PASSWORD
    volumes:
      - type: bind
        source: ${EXPORTER_CONFIG_DIR:-../..}
        target: /etc/gokeenapi
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${EXPORTER_PORT:-9479}:9479"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9479/metrics"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - type: bind
        source: ./prometheus.yaml
        target: /etc/prometheus/prometheus.yaml
        read_only: true
        bind:
          create_host_path: false
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      exporter:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/keenetic.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - type: bind
        source: ./grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${EXPORTER_RUNTIME_DIR:-./.runtime/default}/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
